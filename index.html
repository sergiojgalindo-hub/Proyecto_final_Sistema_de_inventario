<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Proyecto Desarrollo Web</title>
</head>

<body>

    <h2>Iniciar Sesion</h2>

    <form id="formulario-login">
        <p id="mensaje-error" hidden></p>

        <div>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" placeholder="Ingresa tu usuario">
        </div>
        <br>
        <div>
            <label for="contrasenia">Contrasenia:</label>
            <input type="password" id="contrasenia" placeholder="Ingresa tu contrasenia">
        </div>
        <br>
        <button type="submit">Ingresar</button>
    </form>

    <script src="js/login.js"></script>
</body>

</html>
